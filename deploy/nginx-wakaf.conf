server {
    listen 80;
    server_name wakaf.example.go.id;
    # certbot akan menambahkan blok TLS dan pengalihan ke 443 di sini.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wakaf.example.go.id;

    # ssl_certificate & ssl_certificate_key diisi otomatis oleh certbot.

    client_max_body_size 10M;

    access_log /var/log/nginx/wakaf-access.log;
    error_log  /var/log/nginx/wakaf-error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /srv/app-wakaf/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
